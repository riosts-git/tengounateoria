<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 -30 740 960" role="img" aria-labelledby="t d" font-family="Poppins, Inter, system-ui, sans-serif">
  <title id="t">El Árbol de Arquetipos</title>
  <desc id="d">Diez nodos y la memoria (X), ordenados en tres ejes, cuatro planos y siete niveles, con los senderos del Árbol de la Vida. Las tres polaridades (2-3, 4-5 y 7-8) van resaltadas.</desc>
  <!-- Paleta gris y negra del sitio. Formato base: el del camino del héroe. -->
  <style>
    svg{--acento:#A33A2B;--fondo:#EAE8E3}
    .bg{fill:var(--fondo)}
    .band{fill:#DDDAD4;opacity:.7}
    .band.alt{opacity:0}
    .sep{stroke:#1A1919;stroke-opacity:.22;stroke-dasharray:3 5}
    .guide{stroke:#1A1919;stroke-opacity:.18;stroke-dasharray:2 6}
    .guia-nivel{stroke:#1A1919;stroke-opacity:.25;stroke-width:1;stroke-dasharray:1 4}
    .path{stroke:#BDBAB4;stroke-width:2;fill:none}
    .polar{stroke:#1A1919;stroke-width:4.5;stroke-linecap:round;fill:none}
    .flecha{stroke:#6E6C68;stroke-width:2;fill:none}
    .punta{fill:#6E6C68}
    .node{fill:#F4F3F0;stroke:#9C9A95;stroke-width:1.8}
    .node.x{stroke-dasharray:5 4}
    .t{fill:#1A1919;font-size:11.5px;font-weight:600;text-anchor:middle}
    .n{fill:#6E6C68;font-size:10.5px;font-weight:500;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .nuevo{fill:#6E6C68;font-size:12px;font-weight:600;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .titulo{fill:#1A1919;font-size:24px;font-weight:600;text-anchor:middle;letter-spacing:-.01em}
    .eje{fill:#1A1919;font-size:13px;font-weight:600;text-anchor:middle;letter-spacing:.08em}
    .ejesub{fill:#6E6C68;font-size:11px;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .plano{fill:#1A1919;font-size:13px;font-weight:600;letter-spacing:.08em}
    .etapa{fill:#6E6C68;font-size:12.5px;font-family:Inter, system-ui, sans-serif}
    .nivel{fill:#1A1919;font-size:13px;font-weight:600;letter-spacing:.08em;text-anchor:end}
    .nivelsub{fill:#6E6C68;font-size:12.5px;text-anchor:end;font-family:Inter, system-ui, sans-serif}
    @media (prefers-color-scheme:dark){
      svg{--acento:#E8877A;--fondo:#1A1919}
      .band{fill:#2A2928;opacity:.8}
      .sep,.guide,.guia-nivel{stroke:#EAE8E3}
      .path{stroke:#4A4845}
      .polar{stroke:#EAE8E3}
      .node{fill:#232222;stroke:#6E6C68}
      .t,.titulo,.eje,.plano,.nivel{fill:#EAE8E3}
      .n,.nuevo,.ejesub,.etapa,.nivelsub{fill:#9C9A95}
      .flecha{stroke:#9C9A95}
      .punta{fill:#9C9A95}
    }
  </style>

  <rect class="bg" x="70" y="-30" width="740" height="960"/>

  <!-- Planos (franjas) -->
  <!-- los límites entre planos pasan por la mitad de la memoria, del conflicto y de la integración -->
  <rect class="band" x="84" y="95" width="712" height="240"/>
  <rect class="band alt" x="84" y="335" width="712" height="165"/>
  <rect class="band" x="84" y="500" width="712" height="185"/>
  <rect class="band alt" x="84" y="685" width="712" height="235"/>
  <line class="sep" x1="84" y1="335" x2="796" y2="335"/>
  <line class="sep" x1="84" y1="500" x2="796" y2="500"/>
  <line class="sep" x1="84" y1="685" x2="796" y2="685"/>

  <!-- Ejes -->
  <line class="guide" x1="310" y1="80" x2="310" y2="920"/>
  <line class="guide" x1="440" y1="80" x2="440" y2="920"/>
  <line class="guide" x1="570" y1="80" x2="570" y2="920"/>

  <!-- Título y ejes -->
  <text class="titulo" x="440" y="12">El árbol de las emociones</text>
  <text class="eje" x="310" y="56">EJE −</text>
  <text class="ejesub" x="310" y="73">contracción</text>
  <text class="eje" x="440" y="56">EJE 0</text>
  <text class="ejesub" x="440" y="73">centro</text>
  <text class="eje" x="570" y="56">EJE +</text>
  <text class="ejesub" x="570" y="73">expansión</text>

  <!-- Planos -->
  <text class="plano" x="98" y="130">PLANO I</text>
  <text class="etapa" x="98" y="149">Registro y primera</text>
  <text class="etapa" x="98" y="164">valoración.</text>

  <text class="plano" x="98" y="370">PLANO II</text>
  <text class="etapa" x="98" y="389">Proyección y encuentro</text>
  <text class="etapa" x="98" y="404">con la realidad.</text>

  <text class="plano" x="98" y="535">PLANO III</text>
  <text class="etapa" x="98" y="554">Resultado e integración.</text>

  <text class="plano" x="98" y="720">PLANO IV</text>
  <text class="etapa" x="98" y="739">Lo integrado sale del</text>
  <text class="etapa" x="98" y="754">sistema y pasa al mundo.</text>

  <!-- Niveles: con la misma letra que los planos, alineados a la derecha, a la altura de su fila de nodos -->
  <g class="guia-nivel">
    <line x1="488" y1="150" x2="706" y2="150"/>
    <line x1="488" y1="500" x2="706" y2="500"/>
    <line x1="488" y1="685" x2="706" y2="685"/>
    <line x1="488" y1="790" x2="706" y2="790"/>
  </g>
  <text class="nivel" x="782" y="144">NIVEL 1</text>
  <text class="nivelsub" x="782" y="164">Atención.</text>
  <text class="nivelsub" x="782" y="179">¿Qué está ocurriendo?</text>
  <text class="nivel" x="782" y="244">NIVEL 2</text>
  <text class="nivelsub" x="782" y="264">Sensibilidad.</text>
  <text class="nivelsub" x="782" y="279">¿Qué valor tiene esto?</text>
  <text class="nivel" x="782" y="414">NIVEL 3</text>
  <text class="nivelsub" x="782" y="434">Motricidad.</text>
  <text class="nivelsub" x="782" y="449">¿Qué puedo hacer?</text>
  <text class="nivel" x="782" y="494">NIVEL 4</text>
  <text class="nivelsub" x="782" y="514">Conflicto.</text>
  <text class="nivelsub" x="782" y="529">¿Qué pasa al encontrar</text>
  <text class="nivelsub" x="782" y="544">la realidad?</text>
  <text class="nivel" x="782" y="594">NIVEL 5</text>
  <text class="nivelsub" x="782" y="614">Estado.</text>
  <text class="nivelsub" x="782" y="629">¿Qué produjo la acción?</text>
  <text class="nivel" x="782" y="679">NIVEL 6</text>
  <text class="nivelsub" x="782" y="699">Integración.</text>
  <text class="nivelsub" x="782" y="714">¿Qué queda después</text>
  <text class="nivelsub" x="782" y="729">de la experiencia?</text>
  <text class="nivel" x="782" y="784">NIVEL 7</text>
  <text class="nivelsub" x="782" y="804">Trascendencia.</text>
  <text class="nivelsub" x="782" y="819">¿Qué deja lo ocurrido</text>
  <text class="nivelsub" x="782" y="834">en el mundo?</text>

  <!-- Senderos (los 22 del Árbol de la Vida) -->
  <g class="path">
    <line x1="440" y1="150" x2="570" y2="250"/>
    <line x1="440" y1="150" x2="310" y2="250"/>
    <line x1="440" y1="150" x2="440" y2="500"/>
    <line x1="570" y1="250" x2="310" y2="250"/>
    <line x1="570" y1="250" x2="570" y2="420"/>
    <line x1="570" y1="250" x2="440" y2="500"/>
    <line x1="310" y1="250" x2="310" y2="420"/>
    <line x1="310" y1="250" x2="440" y2="500"/>
    <line x1="570" y1="420" x2="310" y2="420"/>
    <line x1="570" y1="420" x2="440" y2="500"/>
    <line x1="570" y1="420" x2="570" y2="600"/>
    <line x1="310" y1="420" x2="440" y2="500"/>
    <line x1="310" y1="420" x2="310" y2="600"/>
    <line x1="440" y1="500" x2="570" y2="600"/>
    <line x1="440" y1="500" x2="310" y2="600"/>
    <line x1="440" y1="500" x2="440" y2="685"/>
    <line x1="570" y1="600" x2="310" y2="600"/>
    <line x1="570" y1="600" x2="440" y2="685"/>
    <line x1="570" y1="600" x2="440" y2="790"/>
    <line x1="310" y1="600" x2="440" y2="685"/>
    <line x1="310" y1="600" x2="440" y2="790"/>
    <line x1="440" y1="685" x2="440" y2="790"/>
  </g>

  <!-- Los senderos claros: las tres polaridades -->
  <g class="polar">
    <line x1="310" y1="250" x2="570" y2="250"/>
    <line x1="310" y1="420" x2="570" y2="420"/>
    <line x1="310" y1="600" x2="570" y2="600"/>
  </g>

  <!-- 10 → nuevo 1 -->
  <line class="flecha" x1="440" y1="838" x2="440" y2="872"/>
  <path class="punta" d="M433 870 L447 870 L440 882 Z"/>
  <text class="nuevo" x="440" y="902">nuevo [1]</text>

  <!-- Nodos: nombre y, debajo, el número -->
  <g>
    <circle class="node" cx="440" cy="150" r="48"/>
    <text class="t" x="440" y="152">Asombro</text><text class="n" x="440" y="170">[1]</text>

    <circle class="node" cx="570" cy="250" r="48"/>
    <text class="t" x="570" y="252">Deseo</text><text class="n" x="570" y="270">[2]</text>

    <circle class="node" cx="310" cy="250" r="48"/>
    <text class="t" x="310" y="252">Aversión</text><text class="n" x="310" y="270">[3]</text>

    <circle class="node x" cx="440" cy="335" r="38"/>
    <text class="t" x="440" y="336">Memoria</text><text class="n" x="440" y="354">[X]</text>

    <circle class="node" cx="570" cy="420" r="48"/>
    <text class="t" x="570" y="408">Motivación</text><text class="t" x="570" y="422">o ira</text><text class="n" x="570" y="440">[4]</text>

    <circle class="node" cx="310" cy="420" r="48"/>
    <text class="t" x="310" y="408">Desmotivación</text><text class="t" x="310" y="422">o miedo</text><text class="n" x="310" y="440">[5]</text>

    <circle class="node" cx="440" cy="500" r="48"/>
    <text class="t" x="440" y="502">La emoción</text><text class="n" x="440" y="520">[6]</text>

    <circle class="node" cx="570" cy="600" r="48"/>
    <text class="t" x="570" y="606">Alegría</text><text class="n" x="570" y="624">[7]</text>

    <circle class="node" cx="310" cy="600" r="48"/>
    <text class="t" x="310" y="606">Tristeza</text><text class="n" x="310" y="624">[8]</text>

    <circle class="node" cx="440" cy="685" r="48"/>
    <text class="t" x="440" y="687">Aprendizaje</text><text class="n" x="440" y="705">[9]</text>

    <circle class="node" cx="440" cy="790" r="48"/>
    <text class="t" x="440" y="778">Predicciones</text><text class="t" x="440" y="792">futuras</text><text class="n" x="440" y="810">[10]</text>
  </g>
</svg>
