<svg viewBox="0 0 1100 880" xmlns="http://www.w3.org/2000/svg" width="1100" height="880"><text x="550" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing=".14em" fill="#A8277F">LA TRÍADA CELESTE</text><image href="contenido/tarot/tarot-dodal/18-la-luna.jpg" x="280" y="130" width="180" height="326" preserveAspectRatio="xMidYMid slice"></image><image href="contenido/tarot/tarot-dodal/17-la-estrella.jpg" x="460" y="130" width="180" height="326" preserveAspectRatio="xMidYMid slice"></image><image href="contenido/tarot/tarot-dodal/19-el-sol.jpg" x="640" y="130" width="180" height="326" preserveAspectRatio="xMidYMid slice"></image><rect x="280" y="130" width="540" height="326" fill="none" stroke="#e4dcd8"></rect><text x="550" y="100" text-anchor="middle" font-family="Caveat, cursive" font-size="24" fill="#A8277F">un fresco que continúa</text><text x="850" y="150" text-anchor="start" font-family="Caveat, cursive" font-size="24" fill="#A8277F">la Estrella marca</text><text x="850" y="176" text-anchor="start" font-family="Caveat, cursive" font-size="24" fill="#A8277F">su posición: arriba</text><path d="M845 160 Q705 115 565 170" fill="none" stroke="#2f2a2e" stroke-width="2" stroke-dasharray="" stroke-linecap="round"></path><path d="M573.1485556697054 161.19085472377074 L565 170 L576.9656639769855 170.9071304150293" fill="none" stroke="#2f2a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><text x="250" y="330" text-anchor="end" font-family="Caveat, cursive" font-size="24" fill="#A8277F">dos fuentes</text><text x="250" y="356" text-anchor="end" font-family="Caveat, cursive" font-size="24" fill="#A8277F">distintas</text><path d="M255 345 Q371.5 388.5 488 352" fill="none" stroke="#2f2a2e" stroke-width="2" stroke-dasharray="" stroke-linecap="round"></path><path d="M479.24938358285436 360.2113770051059 L488 352 L476.12833703339356 350.24968048422414" fill="none" stroke="#2f2a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M255 345 Q410.5 453.5 566 382" fill="none" stroke="#2f2a2e" stroke-width="2" stroke-dasharray="" stroke-linecap="round"></path><path d="M558.3632491692431 391.256351157391 L566 382 L554.0021706118564 381.77176772139603" fill="none" stroke="#2f2a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M548 462 Q549 479 550 556" fill="none" stroke="#A8277F" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"></path><path d="M544.6405361233658 545.2633270071659 L550 556 L555.0788287048553 545.1277647658479" fill="none" stroke="#A8277F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><text x="600" y="510" text-anchor="start" font-family="Caveat, cursive" font-size="24" fill="#A8277F">se mezclan en una</text><text x="600" y="536" text-anchor="start" font-family="Caveat, cursive" font-size="24" fill="#A8277F">que cae sobre el Mago</text><image href="contenido/tarot/tarot-dodal/01-el-mago.jpg" x="490" y="560" width="120" height="218" preserveAspectRatio="xMidYMid slice"></image><text x="550" y="806" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="17" fill="#2f2a2e">El Mago</text><text x="60" y="640" text-anchor="start" font-family="Caveat, cursive" font-size="21" fill="#8a8088">en otros tarots, la Estrella</text><text x="60" y="666" text-anchor="start" font-family="Caveat, cursive" font-size="21" fill="#8a8088">es un astrónomo, con una</text><text x="60" y="692" text-anchor="start" font-family="Caveat, cursive" font-size="21" fill="#8a8088">torre de reloj de fondo</text></svg>