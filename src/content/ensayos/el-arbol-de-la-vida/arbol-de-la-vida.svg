<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 -30 740 930" role="img" aria-labelledby="t d" font-family="Poppins, Inter, system-ui, sans-serif">
  <title id="t">El Árbol de la Vida</title>
  <desc id="d">Las diez sefirot y Daat en sus tres pilares, con los cuatro mundos y la correspondencia con el Árbol de Arquetipos.</desc>
  <!-- Formato base: el del Árbol de Arquetipos. Paleta gris y negra del sitio. -->
  <style>
    svg{--acento:#A33A2B;--fondo:#EAE8E3}
    .bg{fill:var(--fondo)}
    .band{fill:#DDDAD4;opacity:.7}
    .band.alt{opacity:0}
    .sep{stroke:#1A1919;stroke-opacity:.22;stroke-dasharray:3 5}
    .guide{stroke:#1A1919;stroke-opacity:.18;stroke-dasharray:2 6}
    .guia-nivel{stroke:#1A1919;stroke-opacity:.25;stroke-width:1;stroke-dasharray:1 4}
    .path{stroke:#BDBAB4;stroke-width:2;fill:none}
    .polar,.viaje{stroke:#1A1919;stroke-width:4.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
    .flecha{stroke:#6E6C68;stroke-width:2;fill:none}
    .punta{fill:#6E6C68}
    .node{fill:#F4F3F0;stroke:#9C9A95;stroke-width:1.8}
    .node.x{stroke-dasharray:5 4}
    .t{fill:#1A1919;font-size:11.5px;font-weight:600;text-anchor:middle}
    .m,.s{fill:#6E6C68;font-style:italic;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .m{font-size:10px}
    .s{font-size:9.5px}
    .n{fill:#6E6C68;font-size:10.5px;font-weight:500;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .nuevo{fill:#6E6C68;font-size:12px;font-weight:600;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .titulo{fill:#1A1919;font-size:24px;font-weight:600;text-anchor:middle;letter-spacing:-.01em}
    .eje{fill:#1A1919;font-size:13px;font-weight:600;text-anchor:middle;letter-spacing:.08em}
    .ejesub{fill:#6E6C68;font-size:11px;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .plano,.acto{fill:#1A1919;font-size:13px;font-weight:600;letter-spacing:.08em}
    .etapa{fill:#6E6C68;font-size:12.5px;font-family:Inter, system-ui, sans-serif}
    .nivel{fill:#1A1919;font-size:13px;font-weight:600;letter-spacing:.08em;text-anchor:end}
    .nivelsub{fill:#6E6C68;font-size:12.5px;text-anchor:end;font-family:Inter, system-ui, sans-serif}
    .sep.umbral-l{stroke:var(--acento);stroke-opacity:.7;stroke-width:1.5;stroke-dasharray:6 5}
    .umbral{fill:var(--acento);font-size:12px;font-style:italic;text-anchor:end;font-family:Inter, system-ui, sans-serif}
    @media (prefers-color-scheme:dark){
      svg{--acento:#E8877A;--fondo:#1A1919}
      .band{fill:#2A2928;opacity:.8}
      .sep,.guide,.guia-nivel{stroke:#EAE8E3}
      .path{stroke:#4A4845}
      .polar,.viaje{stroke:#EAE8E3}
      .node{fill:#232222;stroke:#6E6C68}
      .t,.titulo,.eje,.plano,.acto,.nivel{fill:#EAE8E3}
      .n,.nuevo,.ejesub,.etapa,.nivelsub,.m,.s{fill:#9C9A95}
      .flecha{stroke:#9C9A95}
      .punta{fill:#9C9A95}
    }
  </style>

  <rect class="bg" x="70" y="-30" width="740" height="930"/>

  <!-- Los cuatro mundos (franjas) -->
  <!-- los límites pasan por la mitad de Daat, Tiféret y Yesod -->
  <rect class="band" x="84" y="95" width="712" height="240"/>
  <rect class="band alt" x="84" y="335" width="712" height="165"/>
  <rect class="band" x="84" y="500" width="712" height="185"/>
  <rect class="band alt" x="84" y="685" width="712" height="185"/>
  <line class="sep" x1="84" y1="335" x2="796" y2="335"/>
  <line class="sep" x1="84" y1="500" x2="796" y2="500"/>
  <line class="sep" x1="84" y1="685" x2="796" y2="685"/>

  <!-- Pilares -->
  <line class="guide" x1="310" y1="80" x2="310" y2="870"/>
  <line class="guide" x1="440" y1="80" x2="440" y2="870"/>
  <line class="guide" x1="570" y1="80" x2="570" y2="870"/>

  <!-- Título y pilares -->
  <text class="titulo" x="440" y="12">El Árbol de la Vida</text>
  <text class="eje" x="310" y="46">PILAR</text>
  <text class="eje" x="310" y="62">IZQUIERDO</text>
  <text class="ejesub" x="310" y="79">rigor, juicio</text>
  <text class="eje" x="440" y="46">PILAR</text>
  <text class="eje" x="440" y="62">CENTRAL</text>
  <text class="ejesub" x="440" y="79">equilibrio</text>
  <text class="eje" x="570" y="46">PILAR</text>
  <text class="eje" x="570" y="62">DERECHO</text>
  <text class="ejesub" x="570" y="79">misericordia</text>

  <!-- Los cuatro mundos -->
  <text class="plano" x="98" y="130">ATZILUT</text>
  <text class="etapa" x="98" y="149">El mundo de la emanación.</text>

  <text class="plano" x="98" y="370">BERIÁ</text>
  <text class="etapa" x="98" y="389">El mundo de la creación.</text>

  <text class="plano" x="98" y="535">YETZIRÁ</text>
  <text class="etapa" x="98" y="554">El mundo de la formación.</text>

  <text class="plano" x="98" y="720">ASIÁ</text>
  <text class="etapa" x="98" y="739">El mundo de la acción.</text>

  <!-- Senderos (los 22) -->
  <g class="path">
    <line x1="440" y1="150" x2="570" y2="250"/>
    <line x1="440" y1="150" x2="310" y2="250"/>
    <line x1="440" y1="150" x2="440" y2="500"/>
    <line x1="570" y1="250" x2="310" y2="250"/>
    <line x1="570" y1="250" x2="570" y2="420"/>
    <line x1="570" y1="250" x2="440" y2="500"/>
    <line x1="310" y1="250" x2="310" y2="420"/>
    <line x1="310" y1="250" x2="440" y2="500"/>
    <line x1="570" y1="420" x2="310" y2="420"/>
    <line x1="570" y1="420" x2="440" y2="500"/>
    <line x1="570" y1="420" x2="570" y2="600"/>
    <line x1="310" y1="420" x2="440" y2="500"/>
    <line x1="310" y1="420" x2="310" y2="600"/>
    <line x1="440" y1="500" x2="570" y2="600"/>
    <line x1="440" y1="500" x2="310" y2="600"/>
    <line x1="440" y1="500" x2="440" y2="685"/>
    <line x1="570" y1="600" x2="310" y2="600"/>
    <line x1="570" y1="600" x2="440" y2="685"/>
    <line x1="570" y1="600" x2="440" y2="790"/>
    <line x1="310" y1="600" x2="440" y2="685"/>
    <line x1="310" y1="600" x2="440" y2="790"/>
    <line x1="440" y1="685" x2="440" y2="790"/>
  </g>

  <!-- Sefirot: nombre, significado y número -->
  <g>
    <circle class="node" cx="440" cy="150" r="48"/>
    <text class="t" x="440" y="146">Kéter</text><text class="m" x="440" y="160">Corona</text><text class="n" x="440" y="177">[1]</text>

    <circle class="node" cx="570" cy="250" r="48"/>
    <text class="t" x="570" y="246">Jojmá</text><text class="m" x="570" y="260">Sabiduría</text><text class="n" x="570" y="277">[2]</text>

    <circle class="node" cx="310" cy="250" r="48"/>
    <text class="t" x="310" y="246">Biná</text><text class="m" x="310" y="260">Entendimiento</text><text class="n" x="310" y="277">[3]</text>

    <circle class="node x" cx="440" cy="335" r="40"/>
    <text class="t" x="440" y="334">Daat</text><text class="m" x="440" y="348">Conocimiento</text>

    <circle class="node" cx="570" cy="420" r="48"/>
    <text class="t" x="570" y="416">Jesed</text><text class="m" x="570" y="430">Misericordia</text><text class="n" x="570" y="447">[4]</text>

    <circle class="node" cx="310" cy="420" r="48"/>
    <text class="t" x="310" y="416">Guevurá</text><text class="m" x="310" y="430">Rigor</text><text class="n" x="310" y="447">[5]</text>

    <circle class="node" cx="440" cy="500" r="48"/>
    <text class="t" x="440" y="496">Tiféret</text><text class="m" x="440" y="510">Belleza</text><text class="n" x="440" y="527">[6]</text>

    <circle class="node" cx="570" cy="600" r="48"/>
    <text class="t" x="570" y="596">Netzaj</text><text class="m" x="570" y="610">Victoria</text><text class="n" x="570" y="627">[7]</text>

    <circle class="node" cx="310" cy="600" r="48"/>
    <text class="t" x="310" y="596">Hod</text><text class="m" x="310" y="610">Esplendor</text><text class="n" x="310" y="627">[8]</text>

    <circle class="node" cx="440" cy="685" r="48"/>
    <text class="t" x="440" y="681">Yesod</text><text class="m" x="440" y="695">Fundamento</text><text class="n" x="440" y="712">[9]</text>

    <circle class="node" cx="440" cy="790" r="48"/>
    <text class="t" x="440" y="786">Malkut</text><text class="m" x="440" y="800">Reino</text><text class="n" x="440" y="817">[10]</text>
  </g>
</svg>
