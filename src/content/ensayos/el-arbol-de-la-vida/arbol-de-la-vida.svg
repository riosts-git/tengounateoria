<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 1180 930" role="img" aria-labelledby="t d" font-family="Poppins, Inter, system-ui, sans-serif">
  <title id="t">El Árbol de la Vida</title>
  <desc id="d">Las diez sefirot y Daat en sus tres pilares, con los cuatro mundos y la correspondencia con el Árbol de Arquetipos.</desc>
  <!-- Formato base: el del camino del héroe. Paleta gris dorada. -->
  <style>
    svg{--acento:#A33A2B;--fondo:#FAF8F4}
    .bg{fill:var(--fondo)}
    .band{fill:#E9DFCB;opacity:.45}
    .band.alt{opacity:0}
    .sep{stroke:#B5A68A;stroke-opacity:.45;stroke-dasharray:3 5}
    .guide{stroke:#B5A68A;stroke-opacity:.35;stroke-dasharray:2 6}
    .path{stroke:#C8BA9E;stroke-width:2;fill:none}
    .node{fill:#FFFFFF;stroke:#B5A68A;stroke-width:1.8}
    .node.x{stroke-dasharray:5 4}
    .t{fill:#4A4337;font-size:12.5px;font-weight:600;text-anchor:middle}
    .m{fill:#7E7464;font-size:10px;font-style:italic;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .n{fill:#9C8A66;font-size:10.5px;font-weight:500;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .titulo{fill:#4A4337;font-size:24px;font-weight:600;text-anchor:middle;letter-spacing:-.01em}
    .eje{fill:#6E6555;font-size:13px;font-weight:600;text-anchor:middle;letter-spacing:.08em}
    .ejesub{fill:#9C9180;font-size:11px;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .plano{fill:#8F7A55;font-size:13px;font-weight:600;letter-spacing:.08em}
    .etapa{fill:#9C9180;font-size:11px;font-family:Inter, system-ui, sans-serif}
    .nivel{fill:#6E6555;font-size:11.5px;font-weight:600;font-family:Inter, system-ui, sans-serif}
    .nivelsub{fill:#9C9180;font-size:11px;font-family:Inter, system-ui, sans-serif}
    .nuestro{fill:#6E6555;font-size:11.5px;font-weight:500;font-family:Inter, system-ui, sans-serif}
    .cab{fill:#6E6555;font-size:12px;font-weight:600;letter-spacing:.08em;font-family:Poppins, Inter, sans-serif}
    @media (prefers-color-scheme:dark){
      svg{--acento:#E8877A;--fondo:#1E1B18}
      .band{fill:#3A3226;opacity:.5}
      .sep,.guide{stroke:#8C7F68}
      .path{stroke:#5E5444}
      .node{fill:#242019;stroke:#8C7F68}
      .t,.titulo{fill:#EDE7DD}
      .n,.plano{fill:#C9AE7C}
      .m,.ejesub,.etapa{fill:#A39A8C}
      .eje,.nuestro,.cab,.nivel{fill:#D9D0C0}
      .nivelsub{fill:#A39A8C}
    }
  </style>

  <rect class="bg" y="-30" width="1180" height="930"/>

  <!-- Los cuatro mundos (franjas) -->
  <!-- los límites pasan por la mitad de Daat, Tiféret y Yesod -->
  <rect class="band" x="20" y="95" width="1140" height="240"/>
  <rect class="band alt" x="20" y="335" width="1140" height="165"/>
  <rect class="band" x="20" y="500" width="1140" height="185"/>
  <rect class="band alt" x="20" y="685" width="1140" height="185"/>
  <line class="sep" x1="20" y1="335" x2="1160" y2="335"/>
  <line class="sep" x1="20" y1="500" x2="1160" y2="500"/>
  <line class="sep" x1="20" y1="685" x2="1160" y2="685"/>

  <!-- Pilares -->
  <line class="guide" x1="470" y1="80" x2="470" y2="870"/>
  <line class="guide" x1="630" y1="80" x2="630" y2="870"/>
  <line class="guide" x1="790" y1="80" x2="790" y2="870"/>

  <!-- Título y pilares -->
  <text class="titulo" x="630" y="12">El Árbol de la Vida</text>
  <text class="eje" x="470" y="56">PILAR IZQUIERDO</text>
  <text class="ejesub" x="470" y="73">rigor, juicio</text>
  <text class="eje" x="630" y="56">PILAR CENTRAL</text>
  <text class="ejesub" x="630" y="73">equilibrio</text>
  <text class="eje" x="790" y="56">PILAR DERECHO</text>
  <text class="ejesub" x="790" y="73">misericordia</text>

  <!-- Los cuatro mundos -->
  <text class="plano" x="40" y="130">ATZILUT</text>
  <text class="etapa" x="40" y="149">El mundo de la emanación.</text>

  <text class="plano" x="40" y="370">BERIÁ</text>
  <text class="etapa" x="40" y="389">El mundo de la creación.</text>

  <text class="plano" x="40" y="535">YETZIRÁ</text>
  <text class="etapa" x="40" y="554">El mundo de la formación.</text>

  <text class="plano" x="40" y="720">ASIÁ</text>
  <text class="etapa" x="40" y="739">El mundo de la acción.</text>

  <!-- Senderos (los 22) -->
  <g class="path">
    <line x1="630" y1="150" x2="790" y2="250"/>
    <line x1="630" y1="150" x2="470" y2="250"/>
    <line x1="630" y1="150" x2="630" y2="500"/>
    <line x1="790" y1="250" x2="470" y2="250"/>
    <line x1="790" y1="250" x2="790" y2="420"/>
    <line x1="790" y1="250" x2="630" y2="500"/>
    <line x1="470" y1="250" x2="470" y2="420"/>
    <line x1="470" y1="250" x2="630" y2="500"/>
    <line x1="790" y1="420" x2="470" y2="420"/>
    <line x1="790" y1="420" x2="630" y2="500"/>
    <line x1="790" y1="420" x2="790" y2="600"/>
    <line x1="470" y1="420" x2="630" y2="500"/>
    <line x1="470" y1="420" x2="470" y2="600"/>
    <line x1="630" y1="500" x2="790" y2="600"/>
    <line x1="630" y1="500" x2="470" y2="600"/>
    <line x1="630" y1="500" x2="630" y2="685"/>
    <line x1="790" y1="600" x2="470" y2="600"/>
    <line x1="790" y1="600" x2="630" y2="685"/>
    <line x1="790" y1="600" x2="630" y2="790"/>
    <line x1="470" y1="600" x2="630" y2="685"/>
    <line x1="470" y1="600" x2="630" y2="790"/>
    <line x1="630" y1="685" x2="630" y2="790"/>
  </g>

  <!-- Sefirot: nombre, significado y número -->
  <g>
    <circle class="node" cx="630" cy="150" r="48"/>
    <text class="t" x="630" y="146">Kéter</text><text class="m" x="630" y="160">Corona</text><text class="n" x="630" y="177">[1]</text>

    <circle class="node" cx="790" cy="250" r="48"/>
    <text class="t" x="790" y="246">Jojmá</text><text class="m" x="790" y="260">Sabiduría</text><text class="n" x="790" y="277">[2]</text>

    <circle class="node" cx="470" cy="250" r="48"/>
    <text class="t" x="470" y="246">Biná</text><text class="m" x="470" y="260">Entendimiento</text><text class="n" x="470" y="277">[3]</text>

    <circle class="node x" cx="630" cy="335" r="40"/>
    <text class="t" x="630" y="334">Daat</text><text class="m" x="630" y="348">Conocimiento</text>

    <circle class="node" cx="790" cy="420" r="48"/>
    <text class="t" x="790" y="416">Jesed</text><text class="m" x="790" y="430">Misericordia</text><text class="n" x="790" y="447">[4]</text>

    <circle class="node" cx="470" cy="420" r="48"/>
    <text class="t" x="470" y="416">Guevurá</text><text class="m" x="470" y="430">Rigor</text><text class="n" x="470" y="447">[5]</text>

    <circle class="node" cx="630" cy="500" r="48"/>
    <text class="t" x="630" y="496">Tiféret</text><text class="m" x="630" y="510">Belleza</text><text class="n" x="630" y="527">[6]</text>

    <circle class="node" cx="790" cy="600" r="48"/>
    <text class="t" x="790" y="596">Netzaj</text><text class="m" x="790" y="610">Victoria</text><text class="n" x="790" y="627">[7]</text>

    <circle class="node" cx="470" cy="600" r="48"/>
    <text class="t" x="470" y="596">Hod</text><text class="m" x="470" y="610">Esplendor</text><text class="n" x="470" y="627">[8]</text>

    <circle class="node" cx="630" cy="685" r="48"/>
    <text class="t" x="630" y="681">Yesod</text><text class="m" x="630" y="695">Fundamento</text><text class="n" x="630" y="712">[9]</text>

    <circle class="node" cx="630" cy="790" r="48"/>
    <text class="t" x="630" y="786">Malkut</text><text class="m" x="630" y="800">Reino</text><text class="n" x="630" y="817">[10]</text>
  </g>
</svg>
