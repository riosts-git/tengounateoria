<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 -30 740 915" role="img" aria-labelledby="t d" font-family="Poppins, Inter, system-ui, sans-serif">
  <title id="t">El camino del héroe en el Árbol de Arquetipos</title>
  <desc id="d">Las etapas de Vogler dentro de los diez nodos y la memoria, con los cuatro actos y el recorrido del 1 al 10 resaltado.</desc>
  <!-- Paleta gris y negra del sitio; el recorrido del viaje va en negro y los umbrales en el color del cuaderno. -->
  <style>
    svg{--acento:#A33A2B;--fondo:#EAE8E3}
    .bg{fill:var(--fondo)}
    .band{fill:#DDDAD4;opacity:.7}
    .band.alt{opacity:0}
    .sep{stroke:#1A1919;stroke-opacity:.22;stroke-dasharray:3 5}
    .guide{stroke:#1A1919;stroke-opacity:.18;stroke-dasharray:2 6}
    .guia-nivel{stroke:#1A1919;stroke-opacity:.25;stroke-width:1;stroke-dasharray:1 4}
    .path{stroke:#BDBAB4;stroke-width:2;fill:none}
    .polar,.viaje{stroke:#1A1919;stroke-width:4.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
    .flecha{stroke:#6E6C68;stroke-width:2;fill:none}
    .punta{fill:#6E6C68}
    .node{fill:#F4F3F0;stroke:#9C9A95;stroke-width:1.8}
    .node.x{stroke-dasharray:5 4}
    .t{fill:#1A1919;font-size:11.5px;font-weight:600;text-anchor:middle}
    .m,.s{fill:#6E6C68;font-style:italic;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .m{font-size:10px}
    .s{font-size:9.5px}
    .n{fill:#6E6C68;font-size:10.5px;font-weight:500;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .nuevo{fill:#6E6C68;font-size:12px;font-weight:600;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .titulo{fill:#1A1919;font-size:24px;font-weight:600;text-anchor:middle;letter-spacing:-.01em}
    .eje{fill:#1A1919;font-size:13px;font-weight:600;text-anchor:middle;letter-spacing:.08em}
    .ejesub{fill:#6E6C68;font-size:11px;text-anchor:middle;font-family:Inter, system-ui, sans-serif}
    .plano,.acto{fill:#1A1919;font-size:13px;font-weight:600;letter-spacing:.08em}
    .etapa{fill:#6E6C68;font-size:12.5px;font-family:Inter, system-ui, sans-serif}
    .nivel{fill:#1A1919;font-size:13px;font-weight:600;letter-spacing:.08em;text-anchor:end}
    .nivelsub{fill:#6E6C68;font-size:12.5px;text-anchor:end;font-family:Inter, system-ui, sans-serif}
    .sep.umbral-l{stroke:var(--acento);stroke-opacity:.7;stroke-width:1.5;stroke-dasharray:6 5}
    .umbral{fill:var(--acento);font-size:12px;font-style:italic;text-anchor:end;font-family:Inter, system-ui, sans-serif}
    @media (prefers-color-scheme:dark){
      svg{--acento:#E8877A;--fondo:#1A1919}
      .band{fill:#2A2928;opacity:.8}
      .sep,.guide,.guia-nivel{stroke:#EAE8E3}
      .path{stroke:#4A4845}
      .polar,.viaje{stroke:#EAE8E3}
      .node{fill:#232222;stroke:#6E6C68}
      .t,.titulo,.eje,.plano,.acto,.nivel{fill:#EAE8E3}
      .n,.nuevo,.ejesub,.etapa,.nivelsub,.m,.s{fill:#9C9A95}
      .flecha{stroke:#9C9A95}
      .punta{fill:#9C9A95}
    }
  </style>

  <rect class="bg" x="70" y="-30" width="740" height="930"/>

  <!-- Actos (franjas) -->
  <rect class="band" x="84" y="95" width="712" height="240"/>
  <rect class="band alt" x="84" y="335" width="712" height="165"/>
  <rect class="band" x="84" y="500" width="712" height="185"/>
  <rect class="band alt" x="84" y="685" width="712" height="185"/>
  <!-- los límites entre actos: primer umbral (mitad del mentor), punto medio (mitad de la gran prueba), umbral de retorno (mitad de la resurrección) -->
  <line class="sep umbral-l" x1="84" y1="335" x2="796" y2="335"/>
  <line class="sep umbral-l" x1="84" y1="500" x2="796" y2="500"/>
  <line class="sep umbral-l" x1="84" y1="685" x2="796" y2="685"/>

  <!-- Ejes -->
  <line class="guide" x1="310" y1="80" x2="310" y2="870"/>
  <line class="guide" x1="440" y1="80" x2="440" y2="870"/>
  <line class="guide" x1="570" y1="80" x2="570" y2="870"/>
  <!-- Título y ejes -->
  <text class="titulo" x="440" y="12">El camino del héroe</text>
  <text class="eje" x="310" y="56">FUERZAS</text>
  <text class="eje" x="310" y="73">ANTAGONISTAS</text>
  <text class="eje" x="440" y="73">EQUILIBRIO</text>
  <text class="eje" x="570" y="56">FUERZAS</text>
  <text class="eje" x="570" y="73">PROTAGONISTAS</text>

  <!-- Actos -->
  <text class="acto" x="98" y="130">ACTO I · PRINCIPIO</text>
  <text class="etapa" x="98" y="149">El mundo ordinario,</text>
  <text class="etapa" x="98" y="164">la llamada y la duda.</text>

  <text class="acto" x="98" y="370">ACTO II · NUDO</text>
  <text class="etapa" x="98" y="389">Los aliados, los enemigos</text>
  <text class="etapa" x="98" y="404">y la gran prueba.</text>

  <text class="acto" x="98" y="535">ACTO III · DESENLACE</text>
  <text class="etapa" x="98" y="554">El triunfo, la pérdida</text>
  <text class="etapa" x="98" y="569">y la transformación.</text>

  <text class="acto" x="98" y="720">REGRESO</text>
  <text class="etapa" x="98" y="739">La heroína o el héroe vuelve</text>
  <text class="etapa" x="98" y="754">y cambia su mundo.</text>

  <!-- Umbrales y punto medio: alineados a la derecha, sobre su línea -->
  <text class="umbral" x="782" y="312">El primer umbral:</text>
  <text class="umbral" x="782" y="327">del mundo ordinario al mundo especial</text>
  <text class="umbral" x="782" y="477">El punto medio:</text>
  <text class="umbral" x="782" y="492">la mitad exacta del viaje</text>
  <text class="umbral" x="782" y="662">El umbral de retorno:</text>
  <text class="umbral" x="782" y="677">del mundo especial al mundo ordinario</text>

  <!-- Senderos -->
  <g class="path">
    <line x1="440" y1="150" x2="570" y2="250"/>
    <line x1="440" y1="150" x2="310" y2="250"/>
    <line x1="440" y1="150" x2="440" y2="500"/>
    <line x1="570" y1="250" x2="310" y2="250"/>
    <line x1="570" y1="250" x2="570" y2="420"/>
    <line x1="570" y1="250" x2="440" y2="500"/>
    <line x1="310" y1="250" x2="310" y2="420"/>
    <line x1="310" y1="250" x2="440" y2="500"/>
    <line x1="570" y1="420" x2="310" y2="420"/>
    <line x1="570" y1="420" x2="440" y2="500"/>
    <line x1="570" y1="420" x2="570" y2="600"/>
    <line x1="310" y1="420" x2="440" y2="500"/>
    <line x1="310" y1="420" x2="310" y2="600"/>
    <line x1="440" y1="500" x2="570" y2="600"/>
    <line x1="440" y1="500" x2="310" y2="600"/>
    <line x1="440" y1="500" x2="440" y2="685"/>
    <line x1="570" y1="600" x2="310" y2="600"/>
    <line x1="570" y1="600" x2="440" y2="685"/>
    <line x1="570" y1="600" x2="440" y2="790"/>
    <line x1="310" y1="600" x2="440" y2="685"/>
    <line x1="310" y1="600" x2="440" y2="790"/>
    <line x1="440" y1="685" x2="440" y2="790"/>
  </g>

  <!-- El viaje: 1 → 10 -->
  <polyline class="viaje" points="440,150 570,250 310,250 570,420 310,420 440,500 570,600 310,600 440,685 440,790"/>

  <!-- Nodos: la etapa de Vogler y, debajo, el número -->
  <g>
    <circle class="node" cx="440" cy="150" r="48"/>
    <text class="t" x="440" y="142">El mundo</text><text class="t" x="440" y="156">ordinario</text><text class="n" x="440" y="174">[1]</text>

    <circle class="node" cx="570" cy="250" r="48"/>
    <text class="t" x="570" y="252">La llamada</text><text class="n" x="570" y="270">[2]</text>

    <circle class="node" cx="310" cy="250" r="48"/>
    <text class="t" x="310" y="242">El rechazo</text><text class="t" x="310" y="256">de la llamada</text><text class="n" x="310" y="274">[3]</text>

    <circle class="node x" cx="440" cy="335" r="38"/>
    <text class="t" x="440" y="337">El mentor</text><text class="n" x="440" y="354">[X]</text>

    <circle class="node" cx="570" cy="420" r="48"/>
    <text class="t" x="570" y="412">Pruebas</text><text class="t" x="570" y="426">y aliados</text><text class="n" x="570" y="444">[4]</text>

    <circle class="node" cx="310" cy="420" r="48"/>
    <text class="t" x="310" y="412">Enemigos</text><text class="t" x="310" y="426">y la cueva</text><text class="n" x="310" y="444">[5]</text>

    <circle class="node" cx="440" cy="500" r="48"/>
    <text class="t" x="440" y="492">La gran</text><text class="t" x="440" y="506">prueba</text><text class="n" x="440" y="524">[6]</text>

    <circle class="node" cx="570" cy="600" r="48"/>
    <text class="t" x="570" y="602">La recompensa</text><text class="n" x="570" y="620">[7]</text>

    <circle class="node" cx="310" cy="600" r="48"/>
    <text class="t" x="310" y="592">El camino</text><text class="t" x="310" y="606">de vuelta</text><text class="n" x="310" y="624">[8]</text>

    <circle class="node" cx="440" cy="685" r="48"/>
    <text class="t" x="440" y="687">La resurrección</text><text class="n" x="440" y="705">[9]</text>

    <circle class="node" cx="440" cy="790" r="48"/>
    <text class="t" x="440" y="782">El regreso</text><text class="t" x="440" y="796">con el elixir</text><text class="n" x="440" y="814">[10]</text>
  </g>
</svg>
